[package]
name = "rugpool"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
repository = "https://github.com/trustware-io/RugPool-NEAR-Hackathon"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true
near-contract-standards.workspace = true

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
near-sandbox = "0.3.12"
near-api = "0.8"
cargo-near-build = "0.11.0"
tokio = { version = "1.12.0", features = ["full"] }
testresult = "0.4.1"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
